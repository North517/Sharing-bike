<!DOCTYPE html>
<html>
<head>
    <title>校园共享单车调度模拟</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; right: 0; left: 0; }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            display: flex;
            align-items: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        #time-slider {
            width: 300px;
            margin: 0 10px;
        }
        #current-time {
            font-weight: bold;
            margin-left: 10px;
        }
        .info-box {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .vehicle-marker, .bike-marker, .parking-marker {
            text-align: center;
            font-weight: bold;
            color: white;
            padding: 2px 5px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1; /* Adjust line height to center text vertically */
        }
        .vehicle-marker {
            background-color: #3388ff; /* Blue for vehicles */
            width: 24px;
            height: 24px;
            font-size: 10px;
            border: 2px solid #0056b3;
        }
        .bike-marker {
            background-color: #ff0000; /* Red for misplaced bikes */
            width: 18px;
            height: 18px;
            font-size: 9px;
            border: 2px solid #b30000;
        }
        .parking-marker {
            background-color: #28a745; /* Green for parking spots */
            width: 20px;
            height: 20px;
            font-size: 9px;
            border: 2px solid #1e7e34;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <button id="play-pause-btn">播放</button>
        <input type="range" id="time-slider" min="0" value="0">
        <span id="current-time">时间: 0</span>
        <div class="info-box">
            <p>无人车: <span id="veh-count">0</span></p>
            <p>乱停单车: <span id="bike-count">0</span></p>
            <p>停车点: <span id="parking-count">0</span></p>
        </div>
    </div>

    <script>
        let map;
        let simulationData = [];
        let currentIndex = 0;
        let isPlaying = false;
        let animationInterval;
        let vehicleMarkers = {};
        let bikeMarkers = {};
        let parkingMarkers = {};
        const updateInterval = 200; // milliseconds per step

        // Initialize map
        function initMap() {
            map = L.map('map').setView([48.1, 11.6], 13); // Default view, will be adjusted
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        // Load simulation data
        async function loadSimulationData() {
            try {
                const response = await fetch('./studies/bike_rebalancing_study/results/bike_rebalancing_sc_1/simulation_data.json');
                simulationData = await response.json();
                console.log('Simulation data loaded:', simulationData);
                if (simulationData.length > 0) {
                    document.getElementById('time-slider').max = simulationData.length - 1;
                    // Set initial map view based on first data point
                    const firstFrame = simulationData[0];
                    let latSum = 0, lonSum = 0, count = 0;

                    // Include parking spots for initial view
                    firstFrame.parking_spots.forEach(p => {
                        latSum += p.lat;
                        lonSum += p.lon;
                        count++;
                        parkingMarkers[p.id] = L.marker([p.lat, p.lon], {
                            icon: L.divIcon({
                                className: 'parking-marker',
                                html: `<span>P${p.id}</span>`,
                                iconSize: [20, 20]
                            })
                        }).addTo(map);
                    });

                    // Include initial vehicles and bikes if any
                    firstFrame.vehicles.forEach(v => {
                        latSum += v.lat;
                        lonSum += v.lon;
                        count++;
                    });
                    firstFrame.misplaced_bikes.forEach(b => {
                        latSum += b.lat;
                        lonSum += b.lon;
                        count++;
                    });

                    if (count > 0) {
                        map.setView([latSum / count, lonSum / count], 13);
                    }
                    updateMap(0); // Display initial state
                }
            } catch (error) {
                console.error('Error loading simulation data:', error);
                alert('无法加载 simulation_data.json 文件。请确保文件存在且路径正确。');
            }
        }

        // Update map elements for a given time step
        function updateMap(index) {
            if (index < 0 || index >= simulationData.length) return;

            currentIndex = index;
            const frame = simulationData[currentIndex];
            document.getElementById('time-slider').value = currentIndex;
            document.getElementById('current-time').textContent = `时间: ${frame.time} 秒`;

            // Update vehicles
            const currentVehicleIds = new Set();
            frame.vehicles.forEach(v => {
                currentVehicleIds.add(v.id);
                if (vehicleMarkers[v.id]) {
                    vehicleMarkers[v.id].setLatLng([v.lat, v.lon]);
                    vehicleMarkers[v.id].bindPopup(`无人车 ID: ${v.id}<br>状态: ${v.status}`).openPopup();
                } else {
                    vehicleMarkers[v.id] = L.marker([v.lat, v.lon], {
                        icon: L.divIcon({
                            className: 'vehicle-marker',
                            html: `<span>V${v.id}</span>`,
                            iconSize: [24, 24]
                        })
                    }).addTo(map).bindPopup(`无人车 ID: ${v.id}<br>状态: ${v.status}`);
                }
            });
            // Remove vehicles that are no longer present
            Object.keys(vehicleMarkers).forEach(id => {
                if (!currentVehicleIds.has(parseInt(id))) {
                    map.removeLayer(vehicleMarkers[id]);
                    delete vehicleMarkers[id];
                }
            });

            // Update misplaced bikes
            const currentBikeIds = new Set();
            frame.misplaced_bikes.forEach(b => {
                currentBikeIds.add(b.id);
                if (bikeMarkers[b.id]) {
                    bikeMarkers[b.id].setLatLng([b.lat, b.lon]);
                    bikeMarkers[b.id].bindPopup(`单车 ID: ${b.id}`).openPopup();
                } else {
                    bikeMarkers[b.id] = L.marker([b.lat, b.lon], {
                        icon: L.divIcon({
                            className: 'bike-marker',
                            html: `<span>B${b.id}</span>`,
                            iconSize: [18, 18]
                        })
                    }).addTo(map).bindPopup(`单车 ID: ${b.id}`);
                }
            });
            // Remove bikes that are no longer present
            Object.keys(bikeMarkers).forEach(id => {
                if (!currentBikeIds.has(parseInt(id))) {
                    map.removeLayer(bikeMarkers[id]);
                    delete bikeMarkers[id];
                }
            });

            // Parking spots are static, only update info box
            document.getElementById('veh-count').textContent = frame.vehicles.length;
            document.getElementById('bike-count').textContent = frame.misplaced_bikes.length;
            document.getElementById('parking-count').textContent = frame.parking_spots.length;
        }

        // Play/Pause functionality
        function togglePlayPause() {
            isPlaying = !isPlaying;
            const playPauseBtn = document.getElementById('play-pause-btn');
            if (isPlaying) {
                playPauseBtn.textContent = '暂停';
                animationInterval = setInterval(() => {
                    if (currentIndex < simulationData.length - 1) {
                        updateMap(currentIndex + 1);
                    } else {
                        // Loop or stop at end
                        updateMap(0); // Loop
                        // stopAnimation(); // Or stop
                    }
                }, updateInterval);
            } else {
                playPauseBtn.textContent = '播放';
                clearInterval(animationInterval);
            }
        }

        function stopAnimation() {
            isPlaying = false;
            clearInterval(animationInterval);
            document.getElementById('play-pause-btn').textContent = '播放';
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadSimulationData();

            document.getElementById('play-pause-btn').addEventListener('click', togglePlayPause);
            document.getElementById('time-slider').addEventListener('input', (event) => {
                stopAnimation(); // Stop animation when manually moving slider
                updateMap(parseInt(event.target.value));
            });
        });
    </script>
</body>
</html>
