{% extends 'base.html' %}

{% block title %}空间热力图 - 共享单车调度系统{% endblock %}

{% block head %}
    <style>
        #heatmap-map {
            width: 100%;
            height: calc(100vh - 180px);
            min-height: 400px;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
{% endblock %}

{% block content %}
<div class="container-fluid h-100 d-flex flex-column" style="padding:15px;">
    <h2 class="mb-2">空间热力图</h2>
    <p class="text-muted mb-2">基于仿真全程单车散落位置，展示校区内高密度堆积热点区域。</p>
    <div class="card flex-grow-1">
        <div class="card-body p-0">
            <div id="heatmap-map"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function initHeatmap() {
        const heatmapMap = L.map('heatmap-map');
        L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>',
            maxZoom: 18
        }).addTo(heatmapMap);

        new ResizeObserver(() => heatmapMap.invalidateSize()).observe(document.getElementById('heatmap-map'));

        try {
            const resp = await fetch('/api/stats');
            if (!resp.ok) throw new Error('无法加载统计数据');
            const d = await resp.json();

            if (d.initial_map_view && d.initial_map_view.bbox) {
                const [min_lat, max_lat, min_lon, max_lon] = d.initial_map_view.bbox;
                heatmapMap.fitBounds(L.latLngBounds(
                    L.latLng(min_lat, min_lon), L.latLng(max_lat, max_lon)
                ), { padding: [40, 40] });
            } else if (d.initial_map_view && d.initial_map_view.center) {
                heatmapMap.setView(d.initial_map_view.center, 16);
            }

            if (d.heat_points && d.heat_points.length) {
                L.heatLayer(d.heat_points, { radius: 20, blur: 25, maxZoom: 18 }).addTo(heatmapMap);
            }
        } catch (e) {
            console.error(e);
        }
    }
    document.addEventListener('DOMContentLoaded', initHeatmap);
</script>
{% endblock %}
