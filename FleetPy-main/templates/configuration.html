{% extends 'base.html' %}

{% block title %}配置 - 共享单车调度系统{% endblock %}

{% block content %}
<div class="container-fluid h-100 d-flex flex-column">
    <h2 class="mb-4">模拟配置</h2>

    <div class="card flex-grow-1">
        <div class="card-body">
            <form>
                <div class="form-group row">
                    <label for="numVehicles" class="col-sm-3 col-form-label">无人车数量</label>
                    <div class="col-sm-9">
                        <input type="number" class="form-control" id="numVehicles" value="10" min="1">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="numBikes" class="col-sm-3 col-form-label">自行车数量</label>
                    <div class="col-sm-9">
                        <input type="number" class="form-control" id="numBikes" value="20" min="1">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="simulationDuration" class="col-sm-3 col-form-label">模拟时长 (小时)</label>
                    <div class="col-sm-9">
                        <input type="number" class="form-control" id="simulationDuration" value="24" min="1">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="speedFactor" class="col-sm-3 col-form-label">模拟速度因子</label>
                    <div class="col-sm-9">
                        <input type="number" class="form-control" id="speedFactor" value="1.0" step="0.1" min="0.1">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="routingAlgorithm" class="col-sm-3 col-form-label">路径规划算法</label>
                    <div class="col-sm-9">
                        <select class="form-control" id="routingAlgorithm">
                            <option>最短路径 (Dijkstra)</option>
                            <option>最快路径</option>
                            <option>自定义算法</option>
                        </select>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="dispatchStrategy" class="col-sm-3 col-form-label">调度策略</label>
                    <div class="col-sm-9">
                        <select class="form-control" id="dispatchStrategy">
                            <option>最近可用</option>
                            <option>需求预测</option>
                            <option>动态再平衡</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">启动新模拟</button>
                <button type="button" class="btn btn-secondary mt-3 ml-2">重置参数</button>
            </form>
            <div class="alert alert-info mt-4" role="alert">
                此页面仍在开发中。未来将在此处实现动态配置和触发模拟的功能。
            </div>
        </div>
    </div>
</div>
{% endblock %}
