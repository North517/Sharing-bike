<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}共享单车调度系统{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent overall page scrolling */
        }
        #app-wrapper {
            display: flex;
            height: 100%;
        }
        #sidebar {
            width: 250px; /* Fixed width for sidebar */
            background-color: #343a40; /* Dark background for sidebar */
            color: white;
            padding: 15px;
            flex-shrink: 0; /* Prevent sidebar from shrinking */
            overflow-y: auto; /* Allow sidebar content to scroll if too long */
            display: flex;
            flex-direction: column;
        }
        #main-panel {
            flex-grow: 1; /* Main content takes remaining space */
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent main panel from causing overflow */
        }
        #main-content {
            flex-grow: 1; /* Content area fills remaining space */
            overflow: hidden;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-heading {
            padding-bottom: 15px;
            text-align: center;
            font-size: 1.25rem;
            border-bottom: 1px solid #495057;
            margin-bottom: 15px;
        }
        .sidebar-nav .nav-link {
            color: #adb5bd;
            padding: 10px 15px;
        }
        .sidebar-nav .nav-link:hover {
            color: white;
            background-color: #495057;
            border-radius: 5px;
        }
        .sidebar-nav .nav-link.active {
            color: white;
            background-color: #007bff;
            border-radius: 5px;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div id="app-wrapper">
        <nav id="sidebar" class="d-flex flex-column">
            <div class="sidebar-heading">共享单车调度系统</div>
            <ul class="nav flex-column sidebar-nav">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="fas fa-map-marked-alt mr-2"></i> 模拟可视化
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/data_analysis' %}active{% endif %}" href="/data_analysis">
                        <i class="fas fa-chart-line mr-2"></i> 数据分析
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/configuration' %}active{% endif %}" href="/configuration">
                        <i class="fas fa-cog mr-2"></i> 配置
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/events' %}active{% endif %}" href="/events">
                        <i class="fas fa-stream mr-2"></i> 运行时间线
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/heatmap' %}active{% endif %}" href="/heatmap">
                        <i class="fas fa-fire-alt mr-2"></i> 空间热力图
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
                        <i class="fas fa-tachometer-alt mr-2"></i> 运营看板
                    </a>
                </li>
                <li class="nav-item mt-2">
                    <a class="nav-link {% if request.path == '/resimulate' %}active{% endif %}" href="/resimulate">
                        <i class="fas fa-sync-alt mr-2"></i> 重新模拟
                    </a>
                </li>
            </ul>
            <div style="margin-top:auto;padding-top:20px;border-top:1px solid #495057;">
                <div style="color:#6c757d;font-size:12px;margin-bottom:8px;">
                    <i class="fas fa-user-circle mr-1"></i>
                    {% if session.username %}{{ session.username }}{% else %}访客{% endif %}
                </div>
                <a href="/logout" class="nav-link" style="color:#dc3545;padding:8px 15px;border-radius:5px;display:block;"
                   onclick="return confirm('确定要退出登录吗？')">
                    <i class="fas fa-sign-out-alt mr-2"></i> 退出登录
                </a>
            </div>
        </nav>
        <div id="main-panel">
            <!-- Optional: A minimal top bar for main panel if needed -->
            <!-- <nav class="navbar navbar-light bg-light">
                <span class="navbar-brand mb-0 h1">{% block page_title %}{% endblock %}</span>
            </nav> -->
            <div id="main-content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- FontAwesome for icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/js/all.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resimulateLink = document.querySelector('a[href="/resimulate"]');
            if (resimulateLink) {
                resimulateLink.addEventListener('click', async function(event) {
                    event.preventDefault(); // Prevent default link navigation

                    if (confirm('确定要重新模拟吗？这可能需要一些时间。')) {
                        try {
                            // Show a loading indicator (optional, but good for UX)
                            const sidebar = document.getElementById('sidebar');
                            const loadingDiv = document.createElement('div');
                            loadingDiv.id = 'resimulate-loading';
                            loadingDiv.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 20px; border-radius: 10px; z-index: 1000;';
                            loadingDiv.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> 正在重新模拟...请稍候...';
                            document.body.appendChild(loadingDiv);

                            const response = await fetch('/resimulate', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                            });

                            document.body.removeChild(loadingDiv);

                            const data = await response.json();

                            if (response.ok) {
                                // 跳转到首页并强制刷新，加载新预设数据
                                window.location.href = '/?t=' + Date.now();
                            } else {
                                alert('重新模拟失败: ' + (data.error || '未知错误'));
                            }
                        } catch (error) {
                            console.error('Error during re-simulation:', error);
                            alert('重新模拟请求失败，请检查控制台。');
                            const loadingDiv = document.getElementById('resimulate-loading');
                            if (loadingDiv) {
                                document.body.removeChild(loadingDiv);
                            }
                        }
                    }
                });
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
