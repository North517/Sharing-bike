{% extends 'base.html' %}

{% block title %}运行事件时间线 - 共享单车调度系统{% endblock %}

{% block content %}
<div class="container-fluid h-100 d-flex flex-column" style="overflow-y:auto;padding:15px;">
    <h2 class="mb-3">运行事件时间线</h2>
    <p class="text-muted">基于仿真数据自动提取的无人车关键事件：出发、捡车、返站。</p>
    <div class="card flex-grow-1">
        <div class="card-body d-flex flex-column p-0">
            <div class="table-responsive" style="max-height:calc(100vh - 220px);overflow-y:auto;">
                <table class="table table-sm table-striped mb-0">
                    <thead class="thead-dark" style="position:sticky;top:0;">
                        <tr>
                            <th>时间</th>
                            <th>车辆 ID</th>
                            <th>事件类型</th>
                            <th>说明</th>
                        </tr>
                    </thead>
                    <tbody id="events-table-body">
                        <tr><td colspan="4" class="text-center text-muted">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadEvents() {
        try {
            const resp = await fetch('/api/stats');
            if (!resp.ok) throw new Error('无法读取数据');
            const d = await resp.json();
            const tbody = document.getElementById('events-table-body');
            tbody.innerHTML = '';

            const typeColors = {
                '从车站出发': 'table-primary',
                '捡起单车':   'table-success',
                '返回车站':   'table-warning'
            };
            const typeIcons = {
                '从车站出发': '🚀',
                '捡起单车':   '🚲',
                '返回车站':   '🏠'
            };

            if (!d.events || d.events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">暂无事件数据</td></tr>';
                return;
            }

            d.events.forEach(ev => {
                const tr = document.createElement('tr');
                tr.className = typeColors[ev.type] || '';
                tr.innerHTML = `
                    <td><code>${ev.time}</code></td>
                    <td><strong>${ev.vehicle}</strong></td>
                    <td>${typeIcons[ev.type] || ''} ${ev.type}</td>
                    <td>${ev.desc}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            document.getElementById('events-table-body').innerHTML =
                '<tr><td colspan="4" class="text-danger">加载失败：' + e.message + '</td></tr>';
        }
    }
    document.addEventListener('DOMContentLoaded', loadEvents);
</script>
{% endblock %}
