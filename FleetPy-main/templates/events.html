{% extends 'base.html' %}

{% block title %}运行事件时间线 - 共享单车调度系统{% endblock %}

{% block head %}
<style>
#events-table-body tr td { color: #e2eaf5 !important; }
#events-table-body tr td code { color: #00d4aa; background: rgba(0,212,170,0.1); padding: 2px 6px; border-radius: 4px; }
#events-table-body tr td strong { color: #3db8f5; }
.event-depart td { background: rgba(61,184,245,0.10) !important; border-left: 3px solid #3db8f5; }
.event-pick   td { background: rgba(0,212,170,0.10) !important; border-left: 3px solid #00d4aa; }
.event-return td { background: rgba(255,181,71,0.10) !important; border-left: 3px solid #ffb547; }
.table th { color: #00d4aa !important; background: rgba(0,212,170,0.08) !important; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
.table td { border-color: rgba(0,212,170,0.08) !important; font-size: 13px; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid h-100 d-flex flex-column" style="overflow-y:auto;padding:15px;">
    <h2 class="mb-3">运行事件时间线</h2>
    <p style="color:var(--text-secondary);font-size:13px;margin-bottom:12px;">基于仿真数据自动提取的无人车关键事件：出发、捡车、返站。</p>
    <div class="card flex-grow-1">
        <div class="card-body d-flex flex-column p-0">
            <div class="table-responsive" style="max-height:calc(100vh - 220px);overflow-y:auto;">
                <table class="table table-sm mb-0">
                    <thead style="position:sticky;top:0;z-index:1;">
                        <tr>
                            <th>时间</th>
                            <th>车辆 ID</th>
                            <th>事件类型</th>
                            <th>说明</th>
                        </tr>
                    </thead>
                    <tbody id="events-table-body">
                        <tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadEvents() {
        try {
            const resp = await fetch('/api/stats');
            if (!resp.ok) throw new Error('无法读取数据');
            const d = await resp.json();
            const tbody = document.getElementById('events-table-body');
            tbody.innerHTML = '';

            const typeClass = {
                '从车站出发': 'event-depart',
                '捡起单车':   'event-pick',
                '返回车站':   'event-return'
            };
            const typeIcons = {
                '从车站出发': '🚀',
                '捡起单车':   '🚲',
                '返回车站':   '🏠'
            };

            if (!d.events || d.events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px;">暂无事件数据</td></tr>';
                return;
            }

            d.events.forEach(ev => {
                const tr = document.createElement('tr');
                tr.className = typeClass[ev.type] || '';
                tr.innerHTML = `
                    <td><code>${ev.time}</code></td>
                    <td><strong>${ev.vehicle}</strong></td>
                    <td>${typeIcons[ev.type] || ''} ${ev.type}</td>
                    <td>${ev.desc}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            document.getElementById('events-table-body').innerHTML =
                '<tr><td colspan="4" style="color:var(--danger);padding:16px;">加载失败：' + e.message + '</td></tr>';
        }
    }
    document.addEventListener('DOMContentLoaded', loadEvents);
</script>
{% endblock %}
