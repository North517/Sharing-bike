{% extends 'base.html' %}

{% block title %}运行事件时间线 - 共享单车调度系统{% endblock %}

{% block content %}
<div class="container-fluid h-100 d-flex flex-column">
    <h2 class="mb-4">运行事件时间线（示意）</h2>
    <p class="text-muted">这里展示无人车在模拟过程中的关键事件，例如出发、捡车、回站等。</p>
    <div class="card flex-grow-1">
        <div class="card-body d-flex flex-column">
            <div class="table-responsive flex-grow-1">
                <table class="table table-sm table-striped">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>车辆 ID</th>
                            <th>事件类型</th>
                            <th>说明</th>
                        </tr>
                    </thead>
                    <tbody id="events-table-body">
                        <!-- 简单示例数据，后续可根据 simulation_data.json 自动生成 -->
                        <tr>
                            <td>00:00:10</td>
                            <td>vehicle_0</td>
                            <td>从车站出发</td>
                            <td>从 P0 出发执行第一轮收车</td>
                        </tr>
                        <tr>
                            <td>00:01:00</td>
                            <td>vehicle_0</td>
                            <td>捡起单车</td>
                            <td>接触附近红点并收车</td>
                        </tr>
                        <tr>
                            <td>00:02:00</td>
                            <td>vehicle_0</td>
                            <td>返回车站</td>
                            <td>在 P1 卸车</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
