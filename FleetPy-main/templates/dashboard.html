{% extends 'base.html' %}

{% block title %}运营看板 - 共享单车调度系统{% endblock %}

{% block head %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="container-fluid h-100 d-flex flex-column">
    <h2 class="mb-4">运营看板（示意）</h2>
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3">
                <div class="card-header">总调度次数</div>
                <div class="card-body">
                    <h5 class="card-title" id="dash-total-dispatches">-- 次</h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-header">平均取车距离</div>
                <div class="card-body">
                    <h5 class="card-title" id="dash-avg-distance">-- 米</h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-info mb-3">
                <div class="card-header">车站平均占用率</div>
                <div class="card-body">
                    <h5 class="card-title" id="dash-station-util">--%</h5>
                </div>
            </div>
        </div>
    </div>

    <div class="row flex-grow-1">
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header">按车站统计调度量</div>
                <div class="card-body">
                    <canvas id="stationDispatchChart" height="160"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header">不同时段调度量</div>
                <div class="card-body">
                    <canvas id="timeOfDayChart" height="160"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function initDashboard() {
        try {
            const resp = await fetch('/dashboard_data.json');
            if (!resp.ok) throw new Error('无法加载 dashboard_data.json');
            const data = await resp.json();

            const scenarioName = "bike_rebalancing_sc_1"; // Assuming this is the relevant scenario

            // Extract KPI values
            const totalDispatches = data['total_number_requests'] ? data['total_number_requests'][scenarioName] : 'N/A';
            const servedRequests = data['served_requests'] ? data['served_requests'][scenarioName] : 'N/A';
            const avgWaitTime = data['average_wait_time'] ? data['average_wait_time'][scenarioName] : 'N/A';
            const avgTripTime = data['average_trip_time'] ? data['average_trip_time'][scenarioName] : 'N/A';
            const totalDistance = data['total_driven_distance_km'] ? data['total_driven_distance_km'][scenarioName] : 'N/A';
            const emptyDistance = data['empty_driven_distance_km'] ? data['empty_driven_distance_km'][scenarioName] : 'N/A';
            const serviceRate = data['service_rate'] ? (data['service_rate'][scenarioName] * 100).toFixed(1) : 'N/A';
            const fleetUtilization = data['fleet_utilization'] ? (data['fleet_utilization'][scenarioName] * 100).toFixed(1) : 'N/A';
            const occupancyRate = data['occupancy_rate'] ? (data['occupancy_rate'][scenarioName] * 100).toFixed(1) : 'N/A';

            // Update dashboard elements
            document.getElementById('dash-total-dispatches').textContent = `${totalDispatches} 次`;
            // Placeholder for average distance, assuming 'empty_driven_distance_km' or 'total_driven_distance_km' can be used as a proxy or calculated from them
            document.getElementById('dash-avg-distance').textContent = `${(totalDistance / servedRequests).toFixed(2)} km`; // This is a rough estimation, needs refinement based on actual KPI
            document.getElementById('dash-station-util').textContent = `${fleetUtilization}%`; // Using fleet utilization as a proxy for now

            // For the charts, we will use static/placeholder data for now, as standard_eval.csv does not contain this granularity
            // 车站调度量
            const stationLabels = ['P0', 'P1', 'P2'];
            const stationCounts = [30, 45, 25]; // Static placeholder
            new Chart(document.getElementById('stationDispatchChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: stationLabels,
                    datasets: [{
                        label: '调度次数',
                        data: stationCounts,
                        backgroundColor: '#007bff'
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { title: { display: true, text: '车站' } },
                        y: { title: { display: true, text: '调度次数' }, beginAtZero: true }
                    }
                }
            });

            // 时段调度量
            const timeLabels = ['早高峰', '平峰', '晚高峰', '夜间'];
            const timeCounts = [40, 20, 50, 10]; // Static placeholder
            new Chart(document.getElementById('timeOfDayChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: timeLabels,
                    datasets: [{
                        label: '调度次数',
                        data: timeCounts,
                        borderColor: '#28a745',
                        fill: false,
                        tension: 0.3
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        } catch (e) {
            console.error(e);
        }
    }

    document.addEventListener('DOMContentLoaded', initDashboard);
</script>
{% endblock %}
